<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code 额度（本机）</title>
<style>
:root{color-scheme:light;--bg:#f4f3f0;--surface:#fcfcfb;--sunken:#f0efec;--text:#0b0b0b;--text2:#52514e;--muted:#8a8984;
--line:#e6e4de;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--warn:#fab219;--crit:#d03b3b}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121211;--surface:#1a1a19;--sunken:#232321;--text:#fff;
--text2:#c3c2b7;--muted:#8d8c85;--line:#2e2e2b;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:15px;margin:0 0 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--muted);font-size:12px}
h3{font-size:13px;color:var(--text2);margin:16px 0 8px;font-weight:600}
.meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:12px}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.range{position:sticky;top:0;z-index:5;padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--sunken);color:var(--text2);
padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--s1);border-color:var(--s1);color:#fff}
.custom{display:none;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;font-size:13px;color:var(--text2)}
.custom.on{display:flex}
.custom input{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}
.rlabel{margin-top:8px;font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{background:var(--sunken);border-radius:10px;padding:12px 14px}
.card.warn{outline:2px solid var(--crit)}
.tl{color:var(--text2);font-size:12px}
.tv{font-size:28px;font-weight:650;line-height:1.25;font-variant-numeric:tabular-nums}
.ts{color:var(--muted);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:6px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--s1);border-radius:3px}
.bar i.high{background:var(--warn)}.bar i.crit{background:var(--crit)}
.stale{display:none;background:var(--crit);color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text2);margin-bottom:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chart{position:relative;min-height:200px}.chart svg{display:block}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;
padding:6px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;white-space:nowrap;z-index:2}
.note{color:var(--muted);font-size:12px;margin-top:10px}
.empty{color:var(--muted);text-align:center}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:500;font-size:12px}
svg text{fill:var(--muted);font-size:11px}
@media (max-width:600px){.tv{font-size:24px}section{padding:14px 12px}}
</style></head><body><main>
<h1>Claude Code 额度（本机）</h1>
<div class="meta"><span id="built">正在读取数据…</span><span>数据来自本机 Claude Code 的 /usage（订阅登录），只含额度百分比和本机 token 统计，不含账号信息和项目明细</span></div>

<div class="stale" id="stale"></div>

<section class="range">
<div class="seg" id="seg">
<button data-r="24h">24 小时</button><button data-r="today">今天</button><button data-r="3d">三天</button><button data-r="7d">七天</button>
<button data-r="month">本月</button><button data-r="all">全部</button><button data-r="custom">自定义</button></div>
<div class="custom" id="custom"><input type="date" id="from"><span>至</span><input type="date" id="to"></div>
<div class="rlabel" id="rlabel"></div>
</section>

<section><h2>账号<small>本机登录的订阅账号，只显示套餐</small></h2><div id="accts"></div></section>

<div id="per"></div>

<section><h2>本机请求时段<small id="srv-sub"></small></h2><div class="chart" id="srv" style="min-height:0"></div></section>

<section id="costsec"></section>

<section><h2>本机用量<small id="bars-sub"></small></h2><div class="cards" id="tot"></div><div class="legend" style="margin-top:12px"><span><i style="background:var(--s1)"></i>主项目</span><span><i style="background:var(--s2)"></i>其他目录</span></div><div class="chart" id="bars"></div></section>
</main>
<script>
// data.json from the data branch, fetched on load and every 5 minutes (see pages_publish.py's docstring)
const SRC = [
  ['GitHub API', 'https://api.github.com/repos/Balloon-356/claude-usage-wnhe/contents/data.json?ref=data', {headers: {Accept: 'application/vnd.github.raw'}}],
  ['raw.githubusercontent.com', 'https://raw.githubusercontent.com/Balloon-356/claude-usage-wnhe/data/data.json', {}],
];
const H = 3600, DAY = 86400;
let D = null, OFF = 0, NOW = Date.now() / 1000, firstPt = NOW;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const loc = t => new Date((t + OFF) * 1000);  // read with getUTC* to get display-timezone fields
const pad2 = n => String(n).padStart(2, '0');
const fmtT = t => {const d = loc(t); return `${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;};
const fmtD = t => {const d = loc(t); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;};
const midnight = t => Math.floor((t + OFF) / DAY) * DAY - OFF;
const parseD = s => {const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 1000 - OFF;};
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;}

// stale banner: judged in the browser, so data that stopped being pushed says so
function banner(err){
  const b = document.getElementById('stale'), msg = [];
  if (err) msg.push(`⚠ 读不到最新数据（${err}）`);
  const age = D ? NOW - D.built : 0;
  if (D && age > D.staleAfter) msg.push(`⚠ 数据已 ${Math.round(age / 60)} 分钟没有更新（生成于 ${fmtT(D.built)}），监控可能停了，下面的数字不代表当前状态`);
  b.style.display = msg.length ? 'block' : 'none';
  b.textContent = msg.join('；');
}

// ---------------------------------------------------------------- range state
let R = {key: 'today', from: 0, to: 0};
function resolve(key, f, t){
  if (key === '24h') return [NOW - DAY, NOW];
  if (key === 'today') return [midnight(NOW), NOW];
  if (key === '3d') return [NOW - 3*DAY, NOW];
  if (key === '7d') return [NOW - 7*DAY, NOW];
  if (key === 'month') {const d = loc(NOW); return [Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)/1000 - OFF, NOW];}
  if (key === 'all') return [Math.min(firstPt, D.bars.length ? D.bars[0][0] * H : NOW), NOW];
  let a = f ? parseD(f) : midnight(NOW), b = t ? parseD(t) + DAY : NOW;
  if (b < a) [a, b] = [b - DAY, a + DAY];
  return [a, Math.min(b, NOW)];
}
function setRange(key, f, t, push=true){
  if (!D) return;
  const [a, b] = resolve(key, f, t);
  R = {key, from: a, to: b};
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x.dataset.r === key));
  document.getElementById('custom').classList.toggle('on', key === 'custom');
  document.getElementById('from').value = fmtD(a);
  document.getElementById('to').value = fmtD(Math.max(a, b - 1));
  document.getElementById('rlabel').textContent = `统计区间：${fmtT(a)} 至 ${fmtT(b)}`;
  if (push) {const h = key === 'custom' ? `r=${fmtD(a)}~${fmtD(Math.max(a, b - 1))}` : `r=${key}`; history.replaceState(null, '', '#' + h);}
  draw();
}
function fromHash(){
  const m = location.hash.match(/r=([^&]+)/);
  if (!m) return setRange('24h', null, null, false);
  const v = decodeURIComponent(m[1]);
  if (v.includes('~')) {const [f, t] = v.split('~'); return setRange('custom', f, t, false);}
  setRange(['24h','today','3d','7d','month','all'].includes(v) ? v : '24h', null, null, false);
}

// ---------------------------------------------------------------- chart
function setup(id, h){const box=document.getElementById(id);box.innerHTML='';const W=box.clientWidth;
  const svg=el('svg',{width:W,height:h,viewBox:`0 0 ${W} ${h}`},box);const tip=document.createElement('div');tip.className='tip';box.appendChild(tip);return {box,svg,tip,W};}
function place(tip, box, ev){const r=box.getBoundingClientRect();tip.style.display='block';
  const x=ev.clientX-r.left, y=ev.clientY-r.top, tw=tip.offsetWidth;
  tip.style.left=Math.max(0,Math.min(box.clientWidth-tw, x+12 > box.clientWidth-tw ? x-tw-12 : x+12))+'px';tip.style.top=Math.max(0,y-40)+'px';}
function xTicks(svg, x, W, L, R_, Hh, t0, t1){
  const span = t1 - t0, hourly = span <= 2*DAY;
  const fit = Math.max(1, Math.floor((W-L-R_)/56));
  const step = hourly ? [1,2,3,4,6,8,12].map(h => h*H).find(s => span/s <= fit) || 12*H : DAY * Math.max(1, Math.ceil(span / DAY / fit));
  let t = hourly ? Math.ceil((t0 + OFF) / step) * step - OFF : midnight(t0) + (midnight(t0) < t0 ? DAY : 0);
  for (; t <= t1; t += step) {const d = loc(t);
    el('text',{x:x(t),y:Hh-5,'text-anchor':'middle'},svg).textContent = hourly && d.getUTCHours() ? `${pad2(d.getUTCHours())}:00` : `${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;}
}
// one window's points -> polylines, split where the window resets or the reading has a gap (5 h window: 2 h, weekly: 1 day)
function pieces(pts, gap){
  const out = []; let cur = null, lastT = 0, lastR = null;
  for (const p of pts) {
    if (!cur || p[2] !== lastR || p[0] - lastT > gap) {cur = []; out.push(cur);}
    cur.push([p[0], p[1]]); lastT = p[0]; lastR = p[2];}
  return out;
}
const GAPS = [2*H, DAY, DAY, DAY, DAY, DAY];
function card(a, k){
  const v = a.q[k];
  if (!v) return `<div class="card"><div class="tl">${D.names[k]}</div><div class="tv">–</div><div class="ts">最新一次 /usage 没有这个窗口，不沿用旧数字</div></div>`;
  const [p, reset, r, eta] = v;
  let sub = `重置于 ${reset ? fmtT(reset) : '–'}`;
  if (r !== null) sub += ` · 近 ${k ? '6 小时' : '30 分钟'} ${r >= 0 ? '+' : ''}${r.toFixed(1)}%/h`;
  if (eta) sub += ` · 预计 ${fmtT(eta)} 用完（早于重置）`;
  const lvl = p >= 90 ? 'crit' : p >= 75 ? 'high' : '';
  return `<div class="card${eta ? ' warn' : ''}"><div class="tl">${D.names[k]}</div><div class="tv">${p}%</div>`
    + `<div class="bar"><i class="${lvl}" style="width:${Math.min(p, 100)}%"></i></div><div class="ts">${sub}</div></div>`;
}
function perAccount(){
  const lg = D.names.map((n, k) => `<span><i style="background:var(--s${k+1})"></i>${n}</span>`).join('');
  document.getElementById('per').innerHTML = D.accts.map((a, i) =>
    `<section><h2>${a.n}<small>读数时间 ${a.read ? fmtT(a.read) : '–'}</small></h2><div class="cards">${D.names.map((_, k) => card(a, k)).join('')}</div>`
    + `<h3>额度走势</h3><div class="legend">${lg}</div><div class="chart" id="ch${i}"></div></section>`).join('');
}
function lineChart(i){
  const a = D.accts[i], Hh = window.innerWidth < 600 ? 200 : 240, {box,svg,tip,W} = setup('ch' + i, Hh), L = 40, R_ = 12, T = 10, B = 22;
  const t1 = R.to, t0 = Math.min(Math.max(R.from, firstPt - H), t1 - H);
  const x = t => L + (t - t0) / Math.max(1, t1 - t0) * (W - L - R_), y = p => T + (1 - p / 100) * (Hh - T - B);
  for (const p of [0, 25, 50, 75, 100]) {el('line',{x1:L,x2:W-R_,y1:y(p),y2:y(p),stroke:css('--line'),'stroke-width':1},svg);
    el('text',{x:L-6,y:y(p)+4,'text-anchor':'end'},svg).textContent = p + '%';}
  xTicks(svg, x, W, L, R_, Hh, t0, t1);
  let any = false;
  a.h.forEach((pts, k) => {
    const col = `var(--s${k+1})`, vis = pts.filter(p => p[0] >= t0 - GAPS[k] && p[0] <= t1);
    if (vis.length) any = true;
    for (const pc of pieces(vis, GAPS[k])) {
      if (pc.length > 1) el('polyline',{points:pc.map(([t,v]) => `${x(Math.max(t, t0)).toFixed(1)},${y(v).toFixed(1)}`).join(' '),fill:'none',stroke:col,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'},svg);
      else el('circle',{cx:x(Math.max(pc[0][0], t0)),cy:y(pc[0][1]),r:3,fill:col},svg);}
    const q = a.q[k]; if (q && q[0] !== null) el('circle',{cx:x(Math.min(NOW, t1)),cy:y(q[0]),r:4,fill:col,stroke:css('--surface'),'stroke-width':2},svg);  // current reading
  });
  if (!any) {el('text',{x:W/2,y:Hh/2,'text-anchor':'middle'},svg).textContent = '所选时间段内没有额度记录'; return;}
  const cross = el('line',{y1:T,y2:Hh-B,stroke:css('--muted'),'stroke-width':1,'stroke-dasharray':'3 3',visibility:'hidden'},svg);
  const hit = el('rect',{x:L,y:T,width:W-L-R_,height:Hh-T-B,fill:'transparent'},svg);
  const move = ev => {const r = svg.getBoundingClientRect(), t = t0 + ((ev.clientX - r.left) - L) / (W - L - R_) * (t1 - t0);
    cross.setAttribute('x1', x(t)); cross.setAttribute('x2', x(t)); cross.setAttribute('visibility', 'visible');
    // value at t = the latest reading at or before t, if its window had not reset yet
    const lines = a.h.map((pts, k) => {let b = null; for (const p of pts) {if (p[0] <= t) b = p; else break;}
      return b && !(b[2] && b[2] < t) && t - b[0] < 3*DAY ? `<span style="color:var(--s${k+1})">■</span> ${D.names[k]}　<b>${b[1]}%</b>` : null;}).filter(Boolean);
    tip.innerHTML = `<b>${fmtT(t)}</b><br>` + (lines.join('<br>') || '无读数'); place(tip, box, ev);};
  hit.addEventListener('mousemove', move);
  hit.addEventListener('touchstart', e => move(e.touches[0]), {passive: true});
  hit.addEventListener('touchmove', e => move(e.touches[0]), {passive: true});
  hit.addEventListener('mouseleave', () => {tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden');});
}
const fmtN = n => n >= 1e8 ? (n/1e8).toFixed(2)+'亿' : n >= 1e4 ? (n/1e4).toFixed(n >= 1e6 ? 0 : 1)+'万' : Math.round(n)+'';
const usd = x => '$' + x.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
// bars: [hour, mine tokens, mine USD, other tokens, other USD]; blue = mine, orange = other (no legend by request)
function barChart(){
  const span = R.to - R.from, size = span <= 3.5*DAY ? H : DAY;
  document.getElementById('bars-sub').textContent = `${size === H ? '每小时' : '每天'} token 总量`;
  const start = size === H ? Math.floor(R.from/H)*H : midnight(R.from), n = Math.max(1, Math.ceil((R.to - start)/size));
  const bars = Array.from({length: n}, (_, i) => ({t: start + i*size, me: 0, other: 0, meUsd: 0, otherUsd: 0}));
  for (const r of D.bars) {const i = Math.floor((r[0]*H - start)/size); if (i < 0 || i >= n) continue;
    const b = bars[i]; b.me += r[1]; b.meUsd += r[2]; b.other += r[3]; b.otherUsd += r[4];}
  const tok = bars.reduce((s, b) => s + b.me + b.other, 0), cost = bars.reduce((s, b) => s + b.meUsd + b.otherUsd, 0);
  const span0 = `${fmtT(start)} 至 ${fmtT(R.to)}`;
  document.getElementById('tot').innerHTML =
    `<div class="card"><div class="tl">累计 token</div><div class="tv">${fmtN(tok)}</div><div class="ts">${span0}，含缓存读写</div></div>`
    + `<div class="card"><div class="tl">累计费用</div><div class="tv">${usd(cost)}</div><div class="ts">按 API 标价折算，订阅不按这个扣钱</div></div>`;
  const Hh = window.innerWidth < 600 ? 180 : 220, {box,svg,tip,W} = setup('bars', Hh), L = 52, R_ = 12, T = 10, B = 22;
  const max = Math.max(1, ...bars.map(b => b.me + b.other)), bw = (W - L - R_) / n, y = v => T + (1 - v/max) * (Hh - T - B);
  for (const f of [0, .5, 1]) {el('line',{x1:L,x2:W-R_,y1:y(max*f),y2:y(max*f),stroke:css('--line'),'stroke-width':1},svg);
    el('text',{x:L-6,y:y(max*f)+4,'text-anchor':'end'},svg).textContent = fmtN(max*f);}
  xTicks(svg, t => L + (t - start)/(n*size)*(W-L-R_) + bw/2, W, L, R_, Hh, start, start + (n-1)*size);
  bars.forEach((b, i) => {const gap = Math.min(2, bw*.15), x0 = L + i*bw + gap, w = Math.max(1, bw - 2*gap);
    const hMe = (Hh-T-B)*b.me/max, hOt = (Hh-T-B)*b.other/max, base = Hh - B;
    if (hMe > 0) el('rect',{x:x0,y:base-hMe,width:w,height:hMe,rx:Math.min(2,w/2),fill:'var(--s1)'},svg);
    if (hOt > 0) el('rect',{x:x0,y:base-hMe-hOt-(hMe>0?2:0),width:w,height:hOt,rx:Math.min(2,w/2),fill:'var(--s2)'},svg);
    const hit = el('rect',{x:L+i*bw,y:T,width:bw,height:Hh-T-B,fill:'transparent'},svg);
    const lab = size === H ? `${fmtT(b.t).slice(0, 8)}:00` : fmtD(b.t);
    const move = ev => {tip.innerHTML = `<b>${lab}</b><br><span style="color:var(--s1)">■</span> <b>${fmtN(b.me)}</b> token · ${usd(b.meUsd)}<br><span style="color:var(--s2)">■</span> <b>${fmtN(b.other)}</b> token · ${usd(b.otherUsd)}`; place(tip, box, ev);};
    hit.addEventListener('mousemove', move);
    hit.addEventListener('touchstart', e => move(e.touches[0]), {passive: true});
    hit.addEventListener('mouseleave', () => tip.style.display = 'none');});
}
const ago = s => s < 90 ? '刚刚' : s < 5400 ? `${Math.round(s/60)} 分钟前` : s < 2*DAY ? `${Math.round(s/H)} 小时前` : `${Math.round(s/DAY)} 天前`;
function acctTable(){
  const cell = v => v ? `${v[0]}%<small class="muted"> ${v[1] ? fmtT(v[1]) + ' 重置' : '重置时间未知'}</small>` : '–';
  const rows = D.accts.map((a, i) => {const age = NOW - a.served, on = age < 600;
    return `<tr><td><span style="color:var(--s${i+1})">■</span> ${a.n}</td>${a.q.map(v => `<td>${cell(v)}</td>`).join('')}`
      + `<td>${on ? '<b style="color:var(--s3)">使用中</b>' : '空闲'}<small class="muted"> ${a.served ? ago(age) : ''}</small></td></tr>`;}).join('');
  document.getElementById('accts').innerHTML = D.accts.length
    ? `<div style="overflow-x:auto"><table><thead><tr><th>账号</th>${D.cols.map(c => `<th>${c}</th>`).join('')}<th>本机状态</th></tr></thead><tbody>${rows}</tbody></table></div><div class="note">百分比后面是该窗口的重置时间（北京时间）。额度是账号级的，包含其他设备和 claude.ai 的用量；本机每 5 到 30 分钟读一次。状态按本机最近 10 分钟有没有请求判断。</div>`
    : '<p class="empty">网关没有返回账号信息</p>';
}
// when each account was serving requests; recording started at D.servedSince, so earlier time is blank
function srvChart(){
  const n = D.accts.length, rowH = 26, Hh = n * rowH + 28, L = 84, R_ = 12, T = 4, B = 22;
  const {box, svg, tip, W} = setup('srv', Hh);
  const t1 = R.to, t0 = Math.min(Math.max(R.from, D.servedSince), t1 - H);
  document.getElementById('srv-sub').textContent = R.from < D.servedSince ? `记录始于 ${fmtT(D.servedSince)}，每 5 分钟采样` : '每 5 分钟采样';
  const x = t => L + (t - t0) / Math.max(1, t1 - t0) * (W - L - R_);
  D.accts.forEach((a, i) => {const y = T + i * rowH;
    el('rect', {x: L, y: y + 3, width: W - L - R_, height: rowH - 6, rx: 4, fill: css('--sunken')}, svg);
    el('text', {x: L - 8, y: y + rowH / 2 + 4, 'text-anchor': 'end'}, svg).textContent = a.n;});
  const evs = D.served.filter(e => e[0] >= t0 && e[0] - D.servedStep <= t1);
  for (const [t, ids] of evs) for (const i of ids) {
    const a = x(Math.max(t0, t - D.servedStep)), b = x(Math.min(t1, t));
    el('rect', {x: a, y: T + i * rowH + 3, width: Math.max(2, b - a), height: rowH - 6, rx: 3, fill: `var(--s${i+1})`}, svg);}
  xTicks(svg, x, W, L, R_, Hh, t0, t1);
  const hit = el('rect', {x: L, y: T, width: W - L - R_, height: Hh - T - B, fill: 'transparent'}, svg);
  const move = ev => {const r = svg.getBoundingClientRect(), t = t0 + ((ev.clientX - r.left) - L) / (W - L - R_) * (t1 - t0);
    const on = D.accts.map((a, i) => evs.some(e => e[1].includes(i) && t > e[0] - D.servedStep - 150 && t <= e[0] + 150) ? a.n : null).filter(Boolean);
    tip.innerHTML = `<b>${fmtT(t)}</b><br>${on.length ? on.join('<br>') : '无请求'}`; place(tip, box, ev);};
  hit.addEventListener('mousemove', move);
  hit.addEventListener('touchstart', e => move(e.touches[0]), {passive: true});
  hit.addEventListener('mouseleave', () => tip.style.display = 'none');
}
// cost: [window name, pct used | null, local USD inside the window]; dollars per 1% is a lower bound
function costTable(){
  const s = document.getElementById('costsec');
  if (!D.cost || !D.cost.length) {s.style.display = 'none'; return;}
  s.style.display = '';
  const rows = D.cost.map(([n, p, u]) => p ? `<tr><td>${n}</td><td>${p}%</td><td>${usd(u)}</td><td>${usd(u / p)}</td><td>${usd(u / p * 100)}</td></tr>`
    : `<tr><td>${n}</td><td>–</td><td>–</td><td>–</td><td>–</td></tr>`).join('');
  s.innerHTML = `<h2>费用与额度<small>当前额度窗口内的本机费用</small></h2><div style="overflow-x:auto"><table><thead><tr><th>额度窗口</th><th>已用</th>`
    + `<th>窗口内本机费用</th><th>每 1% 约合</th><th>100% 约合</th></tr></thead><tbody>${rows}</tbody></table></div>`
    + `<div class="note">按 API 标价折算，订阅不按这个扣钱。费用只含这台机器的请求；额度是账号级的，包括其他设备和 claude.ai，`
    + `所以每 1% 约合的金额是下限。额度为整数百分比（±0.5）。5 小时窗口按重置时间往前推 5 小时计算。</div>`;
}
function draw(){
  if (!D) return;
  acctTable(); D.accts.forEach((a, i) => lineChart(i)); srvChart(); barChart(); costTable();
}

document.querySelectorAll('#seg button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.r === 'custom') setRange('custom', document.getElementById('from').value, document.getElementById('to').value);
  else setRange(b.dataset.r);
}));
for (const id of ['from', 'to']) document.getElementById(id).addEventListener('change', () =>
  setRange('custom', document.getElementById('from').value, document.getElementById('to').value));
window.addEventListener('hashchange', fromHash);
let rt; window.addEventListener('resize', () => {clearTimeout(rt); rt = setTimeout(draw, 150);});
async function load(){
  const errs = [];
  for (const [name, url, opt] of SRC) {
    try {
      const r = await fetch(url, {...opt, cache: 'no-cache'});  // revalidate every time; a 304 is free
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return [await r.json(), name];
    } catch (e) {errs.push(`${name}：${e.message}`);}
  }
  throw new Error(errs.join('，'));
}
async function refresh(){
  let via = null, err = null;
  try {[D, via] = await load();} catch (e) {err = e.message;}
  NOW = Date.now() / 1000;
  if (D) {
    OFF = D.tzOff;
    firstPt = Math.min(NOW, ...D.accts.flatMap(a => a.h.map(s => s.length ? s[0][0] : NOW)));
    if (via) document.getElementById('built').textContent = `数据生成于 ${fmtT(D.built)}（北京时间），${fmtT(NOW)} 从 ${via} 读取`;
    perAccount(); fromHash();
  } else document.getElementById('built').textContent = '没有读到数据';
  banner(err);
}
refresh();
setInterval(refresh, 300 * 1000);
</script></body></html>
